name: Build RAB RAP PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q RAB_RAP_PRO_Android_Studio_v2_1_CAD.zip -d project

      - name: Check Android project
        working-directory: project/RAB_RAP_PRO
        run: |
          echo "=== Project ==="
          ls -la
          echo "=== Settings ==="
          cat settings.gradle
          echo "=== Gradle ==="
          gradle --version

      - name: Build Debug APK
        working-directory: project/RAB_RAP_PRO
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAB-RAP-PRO-APK
          path: project/RAB_RAP_PRO/app/build/outputs/apk/debug/*.apk
